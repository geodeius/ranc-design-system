name: Documentation improvement
description: Report missing, unclear, or inaccurate design-system documentation.
title: '[Docs]: '
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Documentation location
      description: Provide the route or repository path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is missing, unclear, or inconsistent with a source of truth.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what readers should understand after the improvement.
    validations:
      required: true
  - type: checkboxes
    id: status
    attributes:
      label: Source-of-truth check
      options:
        - label: I verified that this request does not invent a component, token, package, export, owner, or stable API.
          required: true
