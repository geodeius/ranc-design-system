name: Bug report
description: Report a reproducible problem in the design-system platform.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Do not include sensitive information.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: accessibility
    attributes:
      label: Accessibility impact
      description: Describe any keyboard, screen-reader, zoom, contrast, or motion impact.
